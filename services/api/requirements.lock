# Complete Python 3.12 resolution for the API runtime, tests, and quality tools.
#
# Platform: resolved for CPython 3.12 on macOS/Linux (what setup and CI use).
# Pins are exact and carry no environment markers, so Windows is unsupported
# here (e.g. uvloop ships no Windows wheels). If Windows support is ever needed,
# regenerate with a marker-preserving tool (pip-tools' pip-compile) rather than
# pip freeze.
#
# Open3D core geometry ops are CPU-bound (no GPU used). open3d 0.18 has no
# cp312 wheel, so the input pins open3d>=0.19.0; refresh this file only from a
# clean Python 3.12 virtual environment as documented in docs/dev-workflows.md,
# then review the lock and OpenAPI contract together.
